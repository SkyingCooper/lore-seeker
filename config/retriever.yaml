retriever:
  embedding:
    provider: "dashscope"
    model: "text-embedding-v4"
    dimension: 1024

  keyword_retrieval:
    engine: "postgres_tsvector"
    top_k: 20

  vector_retrieval:
    index_type: "hnsw"
    top_k: 20

  fusion:
    method: "rrf"
    rrf_k: 60
    candidate_top_k: 30

  rerank:
    provider: "aliyun"
    model: "qwen3-rerank"
    top_k: 5
    min_score: 0.5
