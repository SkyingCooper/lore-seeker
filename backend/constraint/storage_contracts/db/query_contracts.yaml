version: "1.0"
description: "DB 查询约束。所有用户数据查询必须显式携带 user_id 或通过可证明的 ownership join 隔离。"

global_rules:
  require_user_isolation: true
  require_deleted_at_filter_for_tasks: true
  mutation_requires_member: true
  vector_dimension: 1024
  vector_index_type: "hnsw"

contracts:
  list_tasks:
    operation: "select"
    caller: ["api", "planner"]
    tables: ["search_tasks", "topics"]
    required_filters:
      - "search_tasks.user_id = :user_id"
      - "search_tasks.deleted_at IS NULL"
    required_output_fields:
      - "id"
      - "topic_id"
      - "topic_title"
      - "source_sites"
      - "search_mode"
      - "frequency"
      - "status"

  get_task:
    operation: "select"
    caller: ["api", "worker", "planner"]
    tables: ["search_tasks"]
    required_filters:
      - "search_tasks.id = :task_id"
      - "search_tasks.user_id = :user_id"
      - "search_tasks.deleted_at IS NULL"

  insert_search_history:
    operation: "insert"
    caller: ["searcher", "worker"]
    tables: ["search_histories"]
    required_fields:
      - "user_id"
      - "task_id"
      - "query"
      - "source_sites"
      - "search_mode"
      - "status"
      - "result_count"
      - "raw_results"
    optional_fields:
      - "parent_id"
      - "topic_id"
      - "report_id"
      - "retry_count"
      - "execution_duration"
      - "failure_reason"
      - "metadata"
    hierarchy:
      parent_id_null: "overall search history"
      parent_id_present: "subtask search history"
    source_traceability:
      source_sites: "actual executed source sites, not only requested task source_sites"
      search_mode: "actual executed mode: api/crawl/mixed"

  insert_report_and_chunks:
    operation: "insert"
    caller: ["organizer", "worker"]
    tables: ["reports", "knowledge_chunks"]
    required_fields:
      reports:
        - "topic_id"
        - "task_id"
        - "content_md"
        - "toc"
      knowledge_chunks:
        - "report_id"
        - "chunk_index"
        - "content"
        - "summary"
        - "source_search_ids"
        - "embedding"
    optional_fields:
      reports:
        - "token_usage"
      knowledge_chunks:
        - "content_marked"
    embedding_source: "knowledge_chunks.summary"
    source_traceability:
      - "knowledge_chunks.source_search_ids must contain search_histories.id values"
      - "source URL/title details are resolved from search_histories.raw_results"

  retrieve_knowledge:
    operation: "select"
    caller: ["retriever", "api"]
    tables: ["knowledge_chunks", "reports", "search_tasks"]
    required_joins:
      - "reports.id = knowledge_chunks.report_id"
      - "search_tasks.id = reports.task_id"
    required_filters:
      - "search_tasks.user_id = :user_id"
      - "search_tasks.deleted_at IS NULL"
    required_ordering:
      - "knowledge_chunks.embedding <=> :query_embedding"
    keyword_retrieval:
      engine: "postgres_tsvector"
      required_filter: "knowledge_chunks.search_vector @@ plainto_tsquery('simple', :query)"

  upsert_user_preference:
    operation: "insert_or_update"
    caller: ["planner", "api"]
    tables: ["zr_user_preferences"]
    required_fields:
      - "user_id"
      - "key"
      - "value"
      - "category"

  archive_working_session:
    operation: "insert"
    caller: ["planner", "worker"]
    tables: ["zr_working_sessions"]
    required_fields:
      - "user_id"
      - "session_key"
      - "goal"
      - "steps"
      - "started_at"

  query_semantic_memory:
    operation: "select"
    caller: ["planner", "retriever", "organizer"]
    tables: ["zr_semantic_memories"]
    required_filters:
      - "(zr_semantic_memories.user_id = :user_id OR zr_semantic_memories.user_id IS NULL)"
      - "zr_semantic_memories.deleted_at IS NULL"
    required_ordering:
      - "zr_semantic_memories.embedding <=> :query_embedding"
    eviction_fields:
      - "confidence"
      - "last_accessed"

  query_episodic_logs:
    operation: "select"
    caller: ["planner", "organizer"]
    tables: ["zr_episodic_logs"]
    required_filters:
      - "zr_episodic_logs.user_id = :user_id"
      - "zr_episodic_logs.deleted_at IS NULL"
    eviction_fields:
      - "importance"

  update_skill_memory_usage:
    operation: "update"
    caller: ["planner", "worker"]
    tables: ["zr_skill_memories"]
    required_fields:
      - "usage_count"
      - "success_count"
      - "fail_count"
      - "last_used_at"
      - "status"
      - "confidence"

  insert_skill_memory:
    operation: "insert"
    caller: ["planner", "worker"]
    tables: ["zr_skill_memories"]
    required_fields:
      - "title"
      - "desc"
      - "content"
      - "scope"
      - "trigger_patterns"
    optional_fields:
      - "citation"
      - "user_id"
      - "status"
      - "confidence"

  load_skill_memory_stage_one:
    operation: "select"
    caller: ["planner", "worker"]
    tables: ["zr_skill_memories"]
    required_filters:
      - "zr_skill_memories.status = 'active'"
      - "(zr_skill_memories.scope = 'global' OR zr_skill_memories.user_id = :user_id)"
    required_output_fields:
      - "id"
      - "title"
      - "desc"
      - "trigger_patterns"
      - "confidence"
      - "last_used_at"

  insert_guardrail_log:
    operation: "insert"
    caller: ["planner", "searcher", "organizer", "retriever", "worker"]
    tables: ["log_guardrail"]
    required_fields:
      - "agent_name"
      - "hook"
      - "allowed"
      - "alert_level"
      - "sanitized_payload"
    optional_fields:
      - "user_id"
      - "task_id"
      - "operation"
      - "tool_name"
      - "reason"
