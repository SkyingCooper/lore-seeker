version: "1.0"
description: "Redis key 约束。Redis 只保存临时状态，长期业务数据必须落 PostgreSQL。"

defaults:
  namespace_separator: ":"
  task_once_ttl_seconds: 3600
  task_periodic_ttl_seconds: 2592000

patterns:
  session:
    pattern: "session:{session_id}"
    value_schema_ref: "data_schema.json#/definitions/session"
    ttl_seconds: 604800
    owner: "api/auth"
    pii: true

  refresh_token:
    pattern: "refresh_token:{user_id}"
    value_schema_ref: "data_schema.json#/definitions/refresh_token"
    ttl_seconds: 604800
    owner: "api/auth"
    pii: true

  access_token_blacklist:
    pattern: "bl_access:{jti}"
    value_schema_ref: "data_schema.json#/definitions/access_token_blacklist"
    ttl_seconds: "access_token_remaining_lifetime"
    owner: "api/auth"
    pii: false

  captcha:
    pattern: "captcha:{token}"
    value_schema_ref: "data_schema.json#/definitions/captcha"
    ttl_seconds: "CAPTCHA_TTL"
    owner: "api/captcha"
    pii: false

  task_context:
    pattern: "task:{task_id}:context"
    value_schema_ref: "data_schema.json#/definitions/task_context"
    ttl_seconds: "by_frequency"
    owner: "planner"
    pii: false

  task_subtasks:
    pattern: "task:{task_id}:subtasks"
    value_schema_ref: "data_schema.json#/definitions/task_subtasks"
    ttl_seconds: "by_frequency"
    owner: "searcher"
    pii: false

  task_results_raw:
    pattern: "task:{task_id}:results_raw"
    value_schema_ref: "data_schema.json#/definitions/task_results"
    ttl_seconds: "by_frequency"
    owner: "searcher"
    pii: false

  task_results_refined:
    pattern: "task:{task_id}:results_refined"
    value_schema_ref: "data_schema.json#/definitions/task_results"
    ttl_seconds: "by_frequency"
    owner: "organizer"
    pii: false

  task_working_log:
    pattern: "task:{task_id}:working_log"
    value_schema_ref: "data_schema.json#/definitions/working_log"
    ttl_seconds: "by_frequency"
    owner: "planner"
    pii: false

  report_version_sequence:
    pattern: "report_version:{user_id}:{topic_id}:{date}:sequence"
    value_schema_ref: "data_schema.json#/definitions/report_version_sequence"
    ttl_seconds: 172800
    owner: "organizer"
    pii: false

  retriever_session_context:
    pattern: "session:{user_id}:{session_id}:context"
    value_schema_ref: "data_schema.json#/definitions/retriever_session_context"
    ttl_seconds: 1800
    owner: "retriever"
    pii: true

  retriever_semantic_memory:
    pattern: "user:{user_id}:semantic"
    value_schema_ref: "data_schema.json#/definitions/retriever_semantic_memory"
    ttl_seconds: 1800
    owner: "retriever"
    pii: true

  retriever_worklog:
    pattern: "session:{user_id}:{session_id}:retriever_worklog"
    value_schema_ref: "data_schema.json#/definitions/retriever_worklog"
    ttl_seconds: 1800
    owner: "retriever"
    pii: true

  llm_cache:
    pattern: "llm:cache:{model}:{prompt_hash}"
    value_schema_ref: "data_schema.json#/definitions/llm_cache"
    ttl_seconds: 604800
    owner: "core/task_redis"
    pii: false

rules:
  no_business_source_of_truth_in_redis: true
  task_id_must_match_database_search_tasks_id: true
  working_log_must_be_archived_to: "zr_working_sessions"
  guardrail_warning_critical_must_be_archived_to: "log_guardrail"
