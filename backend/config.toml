# Lore Seeker 配置文件
# 非敏感配置放这里，可以提交到 git
# API Key 等 secrets 放 .env（不提交）

# ===== 应用 =====
[app]
jwt_algorithm = "HS256"
jwt_expire_minutes = 10080
cors_origins = ["http://localhost:5173", "http://localhost:3000"]
cookie_secure = false
captcha_ttl_seconds = 300

# ===== 数据库 =====
[database]
url = "postgresql+asyncpg://loreseeker:loreseeker@db:5432/loreseeker"

# ===== Redis =====
[redis]
url = "redis://redis:6379/0"

# ===== Agent LLM 配置 =====
[agent.planner]
# 规划 Agent 大模型（P&E 推理，拆解任务）
provider = "dashscope"
model = "deepseek-v4-pro"

[agent.searcher]
# 搜索 Agent 小模型（评估结果相关性、调整搜索策略）
provider = "dashscope"
model = "deepseek-v4-flash"

[agent.organizer]
# 梳理 Agent 大模型（整理报告、打分）
provider = "dashscope"
model = "qwen3.7-plus"

[agent.retriever]
# 检索 / 问答 Agent 模型（RAG 回答、澄清、重答）
provider = "dashscope"
model = "deepseek-v4-flash"

[agent.memory_manager]
# 记忆管理子 Agent 模型（偏好、语义记忆、情景记忆抽取）
provider = "dashscope"
model = "qwen3.6-plus"

# ===== LLM 供应商 =====
# 可选: deepseek | gemini | openai
[llm]
default_provider = "dashscope"

[llm.deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-chat"

[llm.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta"
model = "gemini-2.0-flash"

[llm.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

[llm.dashscope]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3.6-plus"

# ===== 向量模型 =====
[embedding]
# 可选: dashscope | openai | jina
provider = "dashscope"

[embedding.dashscope]
model = "tongyi-embedding-vision-plus-2026-03-06"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

models = [
    {"model": "tongyi-embedding-vision-plus-2026-03-06", "base_url": "https://dashscope.aliyuncs.com/compatible-mode/v1"},
    {"model": "tongyi-embedding-vision-flash-2026-03-06", "base_url": "https://dashscope.aliyuncs.com/compatible-mode/v1"}
]

[embedding.openai]
model = "text-embedding-3-small"

[embedding.jina]
model = "jina-embeddings-v3"
base_url = "https://api.jina.ai/v1"

# ===== 重排序模型 =====
[reranker]
# 可选: dashscope | jina
provider = "dashscope"

[reranker.dashscope]
model = "qwen3-vl-rerank"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[reranker.jina]
model = "jina-reranker-v2-base-multilingual"
base_url = "https://api.jina.ai/v1"

# ===== 搜索 API 工具 =====
[search]
# 可选: tavily | serpapi | bing
api_provider = "tavily"

[search.tavily]
base_url = "https://api.tavily.com/search"

[search.serpapi]
base_url = "https://serpapi.com/search"

[search.bing]
base_url = "https://api.bing.microsoft.com/v7.0/search"

# ===== 爬虫 =====
[crawler]
enabled = true
headless = true
user_agent = "LoreSeeker/1.0"
request_delay_ms = 1000

# 站点限流策略暂时放在配置文件中，不进入数据库。
[crawler.site_policies.default]
concurrency_limit = 2
request_delay_ms = 1000
timeout_seconds = 60
max_retries = 3
backoff = "exponential"

[crawler.site_policies.github]
concurrency_limit = 2
request_delay_ms = 1500
timeout_seconds = 60
max_retries = 3
backoff = "exponential"

# ===== 站点 API 密钥（非敏感标记，实际 key 在 .env） =====
[site_tokens]
# GitHub Personal Access Token（用于 API 搜索，提高限流配额）
github_enabled = false
